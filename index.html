document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"36b6e502-fc26-45f6-9296-9caedde1d14a\"><\u002Fscript>\n<title>Why Not Us? — Men's Ministry<\u002Ftitle>\n<style>\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; text-wrap: pretty; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }\na { color: var(--color-accent-700); }\na:hover { color: var(--color-accent); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<nav class=\"nav\" style=\"position: sticky; top: 0; z-index: 10; background: var(--color-bg); padding-inline: clamp(20px, 5vw, 72px); flex-wrap: wrap;\">\n  <span class=\"nav-brand\">Why Not Us?<\u002Fspan>\n  <a href=\"#vision\">Vision<\u002Fa>\n  <a href=\"#journey\">Journey<\u002Fa>\n  <a href=\"#workshops\">Workshops<\u002Fa>\n  <a href=\"#join\" class=\"btn btn-primary\" style=\"color: var(--color-bg);\">Join the Prelude<\u002Fa>\n<\u002Fnav>\n\n<main style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px);\">\n\n  <section style=\"padding: 56px 0 72px; display: flex; flex-direction: column; gap: 28px;\">\n    <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">Start here<\u002Fspan>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 28px 56px; align-items: end;\">\n      <h1 style=\"font-size: clamp(42px, 6.2vw, 84px); line-height: 1.04; letter-spacing: -0.02em; margin: 0;\">Watch first.<\u002Fh1>\n      <p style=\"font-size: 19px; line-height: 28px; margin: 0; max-width: 46ch;\">Watch Busy's message by the canal. When it ends, sit in silence for a moment before you scroll on.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position: relative; aspect-ratio: 16 / 9; background: var(--color-neutral-900); overflow: hidden;\">\n      <sc-if value=\"{{ showStill }}\" hint-placeholder-val=\"{{ true }}\">\n        <img src=\"fcfdae3b-6e2b-4049-b191-951600fe7114\" alt=\"Busy by the canal\" class=\"grayscale\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;\">\n        <button sc-camel-on-click=\"{{ play }}\" aria-label=\"Play the video\" style=\"position: absolute; left: 0; bottom: 0; display: flex; align-items: center; gap: 20px; padding: 20px 28px 20px 20px; border: 0; cursor: pointer; background: var(--color-accent); color: var(--color-bg); font: inherit; text-align: left;\" style-hover=\"background: var(--color-accent-600);\">\n          <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"7 4 20 12 7 20 7 4\"><\u002Fpolygon><\u002Fsvg>\n          <span style=\"display: flex; flex-direction: column; gap: 4px;\">\n            <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px;\">Play: Busy, by the canal<\u002Fspan>\n            <span style=\"font-size: 14px;\">A blessing from a stranger<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      {{ videoEl }}\n      <sc-if value=\"{{ showNoVideo }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: clamp(20px, 4vw, 48px); color: var(--color-bg);\">\n          <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;\">Video file to be added<\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(22px, 3vw, 36px); line-height: 1.15; max-width: 28ch;\">\"I only hope that God blesses you in your venture.\"<\u002Fspan>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ stop }}\" style=\"align-self: flex-start; color: var(--color-bg); border-color: var(--color-bg); margin-top: 8px;\">Back to still<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n  <section style=\"padding: 84px 0; display: flex; flex-direction: column; gap: 28px;\">\n    <h2 style=\"font-size: clamp(36px, 5vw, 68px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; max-width: 18ch;\">We stop asking \"Why me?\" and start answering \"Why not us?\"<\u002Fh2>\n    <p style=\"font-size: 19px; line-height: 28px; margin: 0; max-width: 52ch;\">A journey of growth, healing, and love for the men of our congregation and community.<\u002Fp>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n      <a href=\"#join\" class=\"btn btn-primary\" style=\"color: var(--color-bg);\">Join the Prelude<\u002Fa>\n      <a href=\"#journey\" class=\"btn btn-secondary\" style=\"color: var(--color-text);\">See the journey<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n    <span style=\"padding: 28px 0; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; color: var(--color-accent);\">Seen.<\u002Fspan>\n    <span style=\"padding: 28px 0; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; color: var(--color-accent);\">Chosen.<\u002Fspan>\n    <span style=\"padding: 28px 0; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 32px; color: var(--color-accent);\">Not alone.<\u002Fspan>\n  <\u002Fsection>\n\n  <section id=\"spark\" style=\"padding: 84px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 42px 72px; scroll-margin-top: 80px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n      <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">The Spark<\u002Fspan>\n      <p style=\"font-size: 19px; line-height: 28px; margin: 0;\">By a canal lined with willow trees, a young man with a camera stops a stranger named Busy and asks for his message. Busy asks for nothing. He gives a blessing.<\u002Fp>\n      <p style=\"font-size: 17px; line-height: 28px; margin: 0;\">That is the whole ministry in one moment: a man blessing another man for no reason, and a question turned around. Many of us have asked God \"Why me?\" out of pain. This journey teaches us to hear it as a calling.<\u002Fp>\n    <\u002Fdiv>\n    <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 16px; border-top: 2px solid var(--color-divider); padding-top: 28px;\">\n      <blockquote style=\"margin: 0; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2;\">\"Why not? You're a Black boy, you're supposed to do well... so we can rise up as well. If you're doing well, I'm doing well.\"<\u002Fblockquote>\n      <figcaption class=\"text-muted\" style=\"font-size: 15px;\">Busy<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section id=\"vision\" style=\"padding: 84px 0; border-top: 2px solid var(--color-divider); display: flex; flex-direction: column; gap: 36px; scroll-margin-top: 80px;\">\n    <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">The Vision<\u002Fspan>\n    <p style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(24px, 3vw, 38px); line-height: 1.3; margin: 0; max-width: 36ch;\">A brotherhood of men who are honest about their pain, rooted in God's love, and committed to each other's rising. Together we practice emotional intelligence where it meets spiritual intelligence, and we freedom dream the men, fathers, partners, and neighbors God created us to be.<\u002Fp>\n    <h3 style=\"font-size: 22px; margin: 28px 0 0;\">From \"Why me?\" to \"Why not us?\"<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 28px 42px;\">\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 10px;\">\n        <strong style=\"font-family: var(--font-heading); font-size: 19px;\">Moses<\u002Fstrong>\n        <span style=\"font-size: 17px; line-height: 26px;\">\"Who am I, that I should go?\"<\u002Fspan>\n        <span style=\"font-size: 14px; color: var(--color-accent-700);\">Exodus 3:11<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 10px;\">\n        <strong style=\"font-family: var(--font-heading); font-size: 19px;\">Gideon<\u002Fstrong>\n        <span style=\"font-size: 17px; line-height: 26px;\">\"My clan is the weakest... and I am the least in my father's house.\"<\u002Fspan>\n        <span style=\"font-size: 14px; color: var(--color-accent-700);\">Judges 6:15<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 10px;\">\n        <strong style=\"font-family: var(--font-heading); font-size: 19px;\">Jeremiah<\u002Fstrong>\n        <span style=\"font-size: 17px; line-height: 26px;\">\"I am only a youth.\"<\u002Fspan>\n        <span style=\"font-size: 14px; color: var(--color-accent-700);\">Jeremiah 1:6<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size: 19px; line-height: 28px; margin: 0;\">God never asked whether they were qualified. He told them they were chosen.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"journey\" style=\"padding: 84px 0; border-top: 2px solid var(--color-divider); display: flex; flex-direction: column; gap: 36px; scroll-margin-top: 80px;\">\n    <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">The Journey<\u002Fspan>\n    <h2 style=\"font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.015em; margin: 0;\">Four movements<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 28px 32px;\">\n      <div style=\"border-top: 2px solid var(--color-accent); padding-top: 20px; display: flex; flex-direction: column; gap: 8px;\">\n        <span style=\"font-size: 13px; color: var(--color-accent-700);\">01<\u002Fspan>\n        <strong style=\"font-family: var(--font-heading); font-size: 22px;\">The Prelude<\u002Fstrong>\n        <span class=\"text-muted\" style=\"font-size: 15px;\">Gather, write, commit<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 8px;\">\n        <span style=\"font-size: 13px; color: var(--color-accent-700);\">02<\u002Fspan>\n        <strong style=\"font-family: var(--font-heading); font-size: 22px;\">Five Practices<\u002Fstrong>\n        <span class=\"text-muted\" style=\"font-size: 15px;\">Every session<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 8px;\">\n        <span style=\"font-size: 13px; color: var(--color-accent-700);\">03<\u002Fspan>\n        <strong style=\"font-family: var(--font-heading); font-size: 22px;\">Nine Workshops<\u002Fstrong>\n        <span class=\"text-muted\" style=\"font-size: 15px;\">Minister and field partner<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 8px;\">\n        <span style=\"font-size: 13px; color: var(--color-accent-700);\">04<\u002Fspan>\n        <strong style=\"font-family: var(--font-heading); font-size: 22px;\">The Closing<\u002Fstrong>\n        <span class=\"text-muted\" style=\"font-size: 15px;\">Open the letters, be sent<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 42px 72px; margin-top: 36px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <h3 style=\"font-size: 26px; margin: 0;\">The Prelude: A Gathering by the Water<\u002Fh3>\n        <p style=\"font-size: 17px; line-height: 28px; margin: 0;\">The journey opens with one evening or half-day retreat, held near water when possible, as a nod to the canal and to the Jordan, where things begin again.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; border-top: 2px solid var(--color-divider);\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"display: grid; grid-template-columns: 36px 96px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 16px 0; border-bottom: 2px solid var(--color-divider);\">\n            <span style=\"font-size: 13px; color: var(--color-accent-700);\">{{ s.n }}<\u002Fspan>\n            <strong style=\"font-family: var(--font-heading); font-size: 17px;\">{{ s.name }}<\u002Fstrong>\n            <span style=\"font-size: 15px; line-height: 22px;\">{{ s.desc }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 84px 0; border-top: 2px solid var(--color-divider); display: flex; flex-direction: column; gap: 36px;\">\n    <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">Every gathering<\u002Fspan>\n    <h2 style=\"font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.015em; margin: 0;\">The Five Practices<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 28px; margin: 0; max-width: 60ch;\">Emotional intelligence teaches a man to know himself and others. Spiritual intelligence teaches him he is fully known by God. We hold them together because each is incomplete alone.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 28px 28px;\">\n      <sc-for list=\"{{ practices }}\" as=\"p\" hint-placeholder-count=\"5\">\n        <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; display: flex; flex-direction: column; gap: 10px;\">\n          <strong style=\"font-family: var(--font-heading); font-size: 19px;\">{{ p.name }}<\u002Fstrong>\n          <span style=\"font-size: 15px; line-height: 22px;\">{{ p.what }}<\u002Fspan>\n          <span style=\"font-size: 14px; line-height: 20px; color: var(--color-accent-700);\">{{ p.scr }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"workshops\" style=\"padding: 84px 0; border-top: 2px solid var(--color-divider); display: flex; flex-direction: column; gap: 36px; scroll-margin-top: 80px;\">\n    <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">The Journey<\u002Fspan>\n    <h2 style=\"font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.015em; margin: 0;\">Nine Workshops<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 28px; margin: 0; max-width: 60ch;\">Each workshop is co-led by a minister and a partner from the field, so the men hear the clinical and the sacred in the same room.<\u002Fp>\n    <div style=\"display: flex; flex-direction: column; border-top: 2px solid var(--color-divider);\">\n      <sc-for list=\"{{ workshops }}\" as=\"w\" hint-placeholder-count=\"9\">\n        <div style=\"border-bottom: 2px solid var(--color-divider);\">\n          <button sc-camel-on-click=\"{{ w.toggle }}\" aria-expanded=\"{{ w.open }}\" style=\"width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 20px 0; background: none; border: 0; cursor: pointer; font: inherit; color: var(--color-text); text-align: left;\" style-hover=\"color: var(--color-accent-700);\">\n            <span style=\"font-size: 14px; color: var(--color-accent-700);\">{{ w.n }}<\u002Fspan>\n            <strong style=\"font-family: var(--font-heading); font-size: clamp(18px, 2vw, 24px);\">{{ w.title }}<\u002Fstrong>\n            <span style=\"font-size: 24px; line-height: 1; width: 24px;\">{{ w.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ w.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px 32px; padding: 0 0 24px 60px;\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span class=\"text-muted\" style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;\">Focus<\u002Fspan><span style=\"font-size: 15px; line-height: 22px;\">{{ w.focus }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span class=\"text-muted\" style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;\">Co-leader<\u002Fspan><span style=\"font-size: 15px; line-height: 22px;\">{{ w.lead }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 4px;\"><span class=\"text-muted\" style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;\">Anchor Scripture<\u002Fspan><span style=\"font-size: 15px; line-height: 22px; color: var(--color-accent-700);\">{{ w.scr }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 84px 0; border-top: 2px solid var(--color-divider); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 42px 72px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n      <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">The Closing<\u002Fspan>\n      <h2 style=\"font-size: clamp(28px, 3.4vw, 44px); line-height: 1.08; margin: 0;\">Freedom Dreaming, the Vision Made Plain<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n      <p style=\"font-size: 17px; line-height: 28px; margin: 0;\">On the final night, the sealed letters are returned. Each man reads what he wrote at the start, sees how far God has brought him, and writes a new commitment for the road ahead.<\u002Fp>\n      <p style=\"font-size: 17px; line-height: 28px; margin: 0;\">We end where Busy began, by blessing one another. Then we are sent out, no longer asking \"Why me?\" but answering:<\u002Fp>\n      <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 28px; margin: 8px 0 0;\">\"Here am I; send me.\" <span style=\"font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--color-accent-700);\">Isaiah 6:8<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<section id=\"join\" style=\"background: var(--color-accent); color: var(--color-bg); scroll-margin-top: 60px;\">\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 48px 72px; align-items: start;\">\n    <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n      <h2 style=\"font-size: clamp(48px, 7vw, 96px); line-height: 1; letter-spacing: -0.02em; margin: 0;\">Why not us?<\u002Fh2>\n      <p style=\"font-size: 19px; line-height: 28px; margin: 0;\">Join us for the Prelude gathering. Bring an open heart.<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0;\">[Date, time, and location to be added]<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: var(--color-bg); color: var(--color-text); padding: 32px; display: flex; flex-direction: column; gap: 16px;\">\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <strong style=\"font-family: var(--font-heading); font-size: 22px;\">Save me a seat<\u002Fstrong>\n        <div class=\"field\"><label for=\"f-name\">Name<\u002Flabel><input id=\"f-name\" class=\"input\" value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"First and last name\"><\u002Fdiv>\n        <div class=\"field\"><label for=\"f-contact\">Phone or email<\u002Flabel><input id=\"f-contact\" class=\"input\" value=\"{{ contact }}\" sc-camel-on-change=\"{{ setContact }}\" placeholder=\"How we can reach you\"><\u002Fdiv>\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ submit }}\" disabled=\"{{ cantSubmit }}\">I'll be there<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <strong style=\"font-family: var(--font-heading); font-size: 22px;\">You're in, {{ firstName }}.<\u002Fstrong>\n        <p style=\"font-size: 16px; line-height: 26px; margin: 0;\">We'll reach out with the date and place. \"A cord of three strands is not quickly broken.\"<\u002Fp>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ reset }}\" style=\"align-self: flex-start;\">Edit my details<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width: 1200px; margin: 0 auto; padding: 28px clamp(20px, 5vw, 72px); display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; font-size: 13px;\" class=\"text-muted\">\n  <span>Why Not Us? · Men's Ministry<\u002Fspan>\n  <span>Your rising is my rising.<\u002Fspan>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;videoUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://vimeo.com/1234169632&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Video&quot;}, &quot;expandAll&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Workshops&quot;}}\">\nclass Component extends DCLogic {\n  state = { playing: false, open: {}, name: '', contact: '', submitted: false };\n  steps = [\n    { n: '01', name: 'Watch', desc: \"We watch Busy's video together, then sit in silence before anyone speaks.\" },\n    { n: '02', name: 'Reflect', desc: 'When have you asked God \"Why me?\" Who has been a Busy in your life? Who are you supposed to be that for?' },\n    { n: '03', name: 'Write', desc: 'Three letters: to God, to someone he loves, and to the man he is becoming.' },\n    { n: '04', name: 'Seal', desc: 'The letters are sealed and kept by the ministry until the final night.' },\n    { n: '05', name: 'Commit', desc: \"A covenant to show up, to tell the truth, and to carry another man's weight along with his own.\" },\n    { n: '06', name: 'Send', desc: '\"A cord of three strands is not quickly broken.\" (Ecclesiastes 4:12)' }\n  ];\n  practices = [\n    { name: 'Check In', what: 'Name what we feel in real words, because a man who cannot name his pain cannot hand it to God', scr: '\"Jesus wept.\" (John 11:35)' },\n    { name: 'Pause', what: 'Stillness and breath as both regulation and prayer', scr: '\"Be still, and know that I am God.\" (Psalm 46:10)' },\n    { name: 'Reflect', what: 'Journal and let Scripture read us while we read it', scr: '\"Search me, O God, and know my heart.\" (Psalm 139:23)' },\n    { name: 'Confess and Receive', what: 'Share honestly in small groups and receive grace', scr: '\"Confess your faults one to another... that ye may be healed.\" (James 5:16)' },\n    { name: 'Bless', what: 'End every gathering by speaking a blessing over another man, the way Busy did', scr: '\"Encourage one another and build each other up.\" (1 Thessalonians 5:11)' }\n  ];\n  ws = [\n    ['Naming What We Feel', 'Emotional literacy and the courage to feel', 'Licensed therapist', '\"Jesus wept.\" (John 11:35)'],\n    ['The Wounds We Inherited', 'Father wounds, generational patterns, ending cycles', 'Psychologist', '\"I will restore to you the years that the locust hath eaten.\" (Joel 2:25)'],\n    ['Anger, Grief, and the Weight We Carry', 'What sits under anger; permission to mourn', 'Grief counselor', '\"Come unto me, all ye that labour and are heavy laden.\" (Matthew 11:28)'],\n    ['The Courage to Be Known', 'Brotherhood, friendship, vulnerability', 'Minister and peer facilitator', '\"Iron sharpeneth iron.\" (Proverbs 27:17)'],\n    ['Fathers, Mentors, and Legacy', 'Raising and pouring into the next generation', 'Educator', '\"He shall turn the heart of the fathers to the children.\" (Malachi 4:6)'],\n    ['Love, Partnership, and Repair', 'Loving well, fighting fair, rebuilding trust', 'Marriage and family therapist', '\"Love is patient, love is kind.\" (1 Corinthians 13:4)'],\n    ['The Temple We Live In', 'Physical and mental health, rest, Sabbath', 'Health practitioner', '\"Your body is the temple of the Holy Ghost.\" (1 Corinthians 6:19)'],\n    ['Purpose, Work, and Provision', 'Calling, career, stewardship, building wealth', 'Life coach and financial steward', '\"Seek the welfare of the city.\" (Jeremiah 29:7)'],\n    ['Rising Together', 'Serving community and mentoring younger men', 'Community leaders', '\"If one member is honored, all rejoice together.\" (1 Corinthians 12:26)']\n  ];\n  renderVals() {\n    const s = this.state;\n    const videoUrl = (this.props.videoUrl ?? 'https://vimeo.com/1234169632').trim();\n    const vm = videoUrl.match(/vimeo\\.com\\/(?:video\\/)?(\\d+)/);\n    const fill = { position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0, background: '#000' };\n    const videoEl = !s.playing || !videoUrl ? null : vm\n      ? React.createElement('iframe', { src: 'https://player.vimeo.com/video/' + vm[1] + '?autoplay=1', allow: 'autoplay; fullscreen; picture-in-picture', allowFullScreen: true, title: 'Busy, by the canal', style: fill })\n      : React.createElement('video', { src: videoUrl, controls: true, autoPlay: true, style: fill });\n    const expandAll = this.props.expandAll ?? false;\n    const workshops = this.ws.map(([title, focus, lead, scr], i) => {\n      const open = s.open[i] ?? expandAll;\n      return { n: String(i + 1).padStart(2, '0'), title, focus, lead, scr, open, sign: open ? '−' : '+',\n        toggle: () => this.setState(st => ({ open: { ...st.open, [i]: !open } })) };\n    });\n    return {\n      showStill: !s.playing, videoEl, showNoVideo: s.playing && !videoUrl, videoUrl,\n      play: () => this.setState({ playing: true }), stop: () => this.setState({ playing: false }),\n      steps: this.steps, practices: this.practices, workshops,\n      name: s.name, contact: s.contact,\n      setName: e => this.setState({ name: e.target.value }),\n      setContact: e => this.setState({ contact: e.target.value }),\n      cantSubmit: !(s.name.trim() && s.contact.trim()),\n      submit: () => this.setState({ submitted: true }),\n      reset: () => this.setState({ submitted: false }),\n      submitted: s.submitted, notSubmitted: !s.submitted,\n      firstName: s.name.trim().split(' ')[0]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
